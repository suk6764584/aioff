<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <rect width="1600" height="500" fill="#F6F1E8"/>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#24211D">AI OFF · 학습 4단계</text>
  <text x="70" y="118" font-family="Arial, sans-serif" font-size="18" fill="#5B5650">AI를 금지하지 않고, AI가 도운 사고를 마지막에 학생이 다시 직접 수행합니다.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="175" width="310" height="210" rx="20" fill="#FFFDFC" stroke="#356FE8" stroke-width="3"/>
    <circle cx="115" cy="218" r="24" fill="#356FE8"/><text x="108" y="227" font-size="22" font-weight="700" fill="#fff">1</text>
    <text x="105" y="280" font-size="27" font-weight="700" fill="#24211D">AI ON</text>
    <text x="105" y="320" font-size="19" fill="#5B5650">실제 자료·사례를 보며</text>
    <text x="105" y="350" font-size="19" fill="#5B5650">AI와 학습 대화</text>

    <path d="M395 280 H455" stroke="#8A837A" stroke-width="4"/><polygon points="455,280 438,270 438,290" fill="#8A837A"/>

    <rect x="470" y="175" width="310" height="210" rx="20" fill="#FFFDFC" stroke="#356FE8" stroke-width="3"/>
    <circle cx="515" cy="218" r="24" fill="#356FE8"/><text x="508" y="227" font-size="22" font-weight="700" fill="#fff">2</text>
    <text x="505" y="280" font-size="27" font-weight="700" fill="#24211D">대화 분석</text>
    <text x="505" y="320" font-size="19" fill="#5B5650">AI가 대신하거나 크게 도운</text>
    <text x="505" y="350" font-size="19" fill="#5B5650">사고·검증 기능 파악</text>

    <path d="M795 280 H855" stroke="#8A837A" stroke-width="4"/><polygon points="855,280 838,270 838,290" fill="#8A837A"/>

    <rect x="870" y="175" width="310" height="210" rx="20" fill="#FFFDFC" stroke="#F06A3C" stroke-width="3"/>
    <circle cx="915" cy="218" r="24" fill="#F06A3C"/><text x="908" y="227" font-size="22" font-weight="700" fill="#fff">3</text>
    <text x="905" y="280" font-size="27" font-weight="700" fill="#24211D">AI OFF</text>
    <text x="905" y="320" font-size="19" fill="#5B5650">위임도가 높은 기능을 중심으로</text>
    <text x="905" y="350" font-size="19" fill="#5B5650">맞춤 문제 3개 직접 수행</text>

    <path d="M1195 280 H1255" stroke="#8A837A" stroke-width="4"/><polygon points="1255,280 1238,270 1238,290" fill="#8A837A"/>

    <rect x="1270" y="175" width="260" height="210" rx="20" fill="#FFFDFC" stroke="#2E8A66" stroke-width="3"/>
    <circle cx="1315" cy="218" r="24" fill="#2E8A66"/><text x="1308" y="227" font-size="22" font-weight="700" fill="#fff">4</text>
    <text x="1305" y="280" font-size="27" font-weight="700" fill="#24211D">비교·피드백</text>
    <text x="1305" y="320" font-size="19" fill="#5B5650">AI에 맡긴 정도와</text>
    <text x="1305" y="350" font-size="19" fill="#5B5650">직접 적용 결과 비교</text>
  </g>
</svg>